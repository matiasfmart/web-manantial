services:
  - type: web
    name: iglesia-manantial-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      # ID del Google Sheet que alimenta los textos del sitio (ver README).
      # Sin este valor, el sitio usa el contenido por defecto embebido en el código.
      - key: GOOGLE_SHEET_ID
        sync: false
    autoDeploy: true
